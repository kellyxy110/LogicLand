# Fly.io manifest for the LogicLand Intelligence Engine (ADR-024).
# One supported deploy target; secrets are set with `fly secrets set ...`,
# never committed. See docs/engine-deployment.md.
app = "logicland-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  LOG_LEVEL = "INFO"
  JSON_LOGS = "true"
  SERVICE_AUTH_ENABLED = "true"
  RATE_LIMIT_REQUESTS = "120"
  RATE_LIMIT_WINDOW_S = "60"
  LLM_PROVIDER = "openai"
  LLM_MODEL = "gpt-4o-mini"
  LLM_CHILD_SAFETY_ENABLED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "get"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
